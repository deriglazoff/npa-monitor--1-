# Тематический фильтр отбора документов.
# Документ попадает в выгрузку, если сработало хотя бы одно ключевое слово
# хотя бы из одного направления. Совпадение — по нормализованному тексту
# (нижний регистр, ё→е), поиск подстроки по основе слова.
#
# Чтобы сузить или расширить охват — правьте только этот файл, код не трогая.

topics:
  Финансовый сектор:
    - МФК
    - МКК
    - микрофинанс
    - ломбард
    - ПКО
    - коллектор
    - кредитован
